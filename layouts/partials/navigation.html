<nav class="main-nav">
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 3a9 9 0 0 0 0 18V3z"></path>
    </svg>
  </button>
  {{ if ne .IsHome true }}
  <a class="normal" href="/"> <span class="arrow">←</span> Home</a>
  {{ end }}

	{{ range .Site.Menus.main }}
		{{ if .Page.Params.redirect }}
			<a href="{{ .Page.Params.redirect }}">{{ .Name }}</a>
		{{ else }}
			<a href="{{ .URL | relLangURL | safeURL }}">{{ .Name }}</a>
		{{ end }}
	{{ end }}

</nav>
