<style id="persistent-navigation-styles">
  body nav.main-nav {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    position: fixed !important;
    top: 0;
    right: 0;
    left: 0;
    width: 100% !important;
    min-height: 46px;
    padding: 20px 20px 2px !important;
    margin: 0 !important;
    background: var(--nav-bg, rgba(255, 255, 255, .90));
    z-index: 1000 !important;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .main-nav-spacer {
    display: block;
    height: 46px;
  }

  .main-nav > .nav-links {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end;
    margin-left: auto;
  }

  .main-nav .nav-brand {
    display: inline-flex !important;
    align-items: center !important;
    flex: 0 0 auto;
    min-width: 72px;
  }

  .main-nav .nav-brand-label {
    display: inline-block;
    margin-left: 8px;
    color: var(--text-strong, #000);
    font-size: 13px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .main-nav .nav-brand-label.is-home-label {
    opacity: 0;
    transform: translateX(-6px);
    will-change: opacity, transform;
  }

  .main-nav .nav-home-target,
  .main-nav .nav-home-button {
    display: block !important;
    flex: 0 0 24px !important;
    width: 24px !important;
    height: 24px !important;
    min-width: 24px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 50% !important;
    clip-path: circle(50%);
    box-shadow: none !important;
    overflow: hidden;
  }

  .main-nav .nav-home-target {
    pointer-events: none;
    overflow: visible;
  }

  .main-nav .nav-home-avatar {
    display: block !important;
    width: 24px !important;
    max-width: 24px !important;
    height: 24px !important;
    margin: 0 !important;
    padding: 0 !important;
    border-radius: 50% !important;
    clip-path: circle(50%);
    object-fit: cover;
  }

  .main-nav .theme-toggle {
    display: inline-flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 24px !important;
    width: 24px !important;
    height: 24px !important;
    margin: 0 0 0 12px !important;
    padding: 2px !important;
    color: var(--text-strong, #000) !important;
    background: transparent !important;
    border: 0 !important;
    border-radius: 50% !important;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .main-nav .theme-toggle svg {
    display: block !important;
    flex: 0 0 20px !important;
    width: 20px !important;
    height: 20px !important;
    overflow: visible;
  }

  .profile-avatar-slot {
    display: block;
    width: 80px;
    height: 80px;
    margin: 0 auto 1em;
    position: relative;
  }

  .profile-home-link,
  .profile #avatar {
    display: block !important;
    width: 100%;
    height: 100%;
    margin: 0 !important;
    padding: 0 !important;
    border-radius: 50% !important;
  }

  .avatar-motion-ready .profile-home-link {
    position: fixed !important;
    z-index: 1100;
    will-change: top, left, width, height;
  }
</style>

<nav class="main-nav">
  <span class="nav-brand">
  {{ if .IsHome }}
    <span class="nav-home-target" aria-hidden="true"></span>
    <span class="nav-brand-label is-home-label" aria-hidden="true">DFTE</span>
  {{ else }}
    <a class="nav-home-button" href="/" aria-label="Home" title="Home">
      <img class="nav-home-avatar" src="{{ .Site.Author.avatar }}" width="24" height="24" alt="">
    </a>
    <span class="nav-brand-label" aria-hidden="true">DFTE</span>
  {{ end }}
  </span>

  <span class="nav-links">
    {{ if .IsHome }}
    <a class="normal paged-home-link" href="/" hidden> <span class="arrow">←</span> Home</a>
    {{ else }}
    <a class="normal" href="/"> <span class="arrow">←</span> Home</a>
    {{ end }}

    {{ range .Site.Menus.main }}
      {{ if .Page.Params.redirect }}
        <a href="{{ .Page.Params.redirect }}">{{ .Name }}</a>
      {{ else }}
        <a href="{{ .URL | relLangURL | safeURL }}">{{ .Name }}</a>
      {{ end }}
    {{ end }}

    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
        <path d="M12 3a9 9 0 0 1 0 18v-4.75a4.25 4.25 0 0 0 0-8.5V3z" fill="currentColor"></path>
        <path d="M12 7.75a4.25 4.25 0 0 0 0 8.5v-8.5z" fill="currentColor"></path>
      </svg>
    </button>
  </span>

</nav>
<div class="main-nav-spacer" aria-hidden="true"></div>

<script>
  (function () {
    var toggle = document.querySelector(".theme-toggle");
    var pagedHomeLink = document.querySelector(".paged-home-link");
    var root = document.documentElement;
    var themeColor = document.getElementById("theme-color");
    var storageKey = "site-theme";
    var nav = document.querySelector(".main-nav");

    function updateNavState() {
      if (nav) nav.classList.toggle("is-scrolled", window.scrollY > 0);
    }

    window.addEventListener("scroll", updateNavState, { passive: true });
    updateNavState();

    if (pagedHomeLink && /\/page\/[2-9][0-9]*\/?$/.test(window.location.pathname)) {
      pagedHomeLink.hidden = false;
    }

    if (!toggle) return;

    function updateToggle() {
      var isDark = root.getAttribute("data-theme") === "dark";
      var label = isDark ? "Switch to light mode" : "Switch to dark mode";

      toggle.setAttribute("aria-pressed", String(isDark));
      toggle.setAttribute("aria-label", label);
      toggle.setAttribute("title", label);
      themeColor.setAttribute("content", isDark ? "#282c34" : "#fff");
    }

    toggle.addEventListener("click", function () {
      var nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", nextTheme);

      try {
        localStorage.setItem(storageKey, nextTheme);
      } catch (error) {}

      updateToggle();
    });

    updateToggle();

    function initCollapsingAvatar() {
      var avatarLink = document.querySelector(".profile-home-link");
      var avatarSlot = document.querySelector(".profile-avatar-slot");
      var avatarTarget = document.querySelector(".nav-home-target");
      var brandLabel = document.querySelector(".nav-brand-label.is-home-label");

      if (!nav || !avatarLink || !avatarSlot || !avatarTarget) return;

      var root = document.documentElement;
      var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var frame = null;
      var startLeft = 0;
      var startTop = 0;
      var startSize = 80;
      var targetLeft = 20;
      var targetTop = 20;
      var targetSize = 24;
      var collapseDistance = 160;

      function measure() {
        var slotRect = avatarSlot.getBoundingClientRect();
        var targetRect = avatarTarget.getBoundingClientRect();

        startLeft = slotRect.left;
        startTop = slotRect.top + window.scrollY;
        startSize = slotRect.width;
        targetLeft = targetRect.left;
        targetTop = targetRect.top;
        targetSize = targetRect.width || 24;
        collapseDistance = Math.max(120, Math.min(220, startTop - targetTop + 40));

        root.classList.add("avatar-motion-ready");
        updatePosition();
      }

      function updatePosition() {
        frame = null;

        var scrollTop = Math.max(window.scrollY, 0);
        var progress = reducedMotion ? (scrollTop > 0 ? 1 : 0) : Math.min(scrollTop / collapseDistance, 1);
        var naturalTop = startTop - scrollTop;
        var left = startLeft + (targetLeft - startLeft) * progress;
        var top = naturalTop + (targetTop - naturalTop) * progress;
        var size = startSize + (targetSize - startSize) * progress;
        var labelProgress = reducedMotion
          ? (scrollTop > 0 ? 1 : 0)
          : Math.max(0, Math.min((scrollTop - collapseDistance) / 60, 1));

        avatarLink.style.left = left + "px";
        avatarLink.style.top = top + "px";
        avatarLink.style.width = size + "px";
        avatarLink.style.height = size + "px";
        if (brandLabel) {
          brandLabel.style.opacity = labelProgress;
          brandLabel.style.transform = "translateX(" + (-6 * (1 - labelProgress)) + "px)";
        }
        nav.classList.toggle("is-scrolled", scrollTop > 0);
      }

      function requestUpdate() {
        if (frame === null) frame = window.requestAnimationFrame(updatePosition);
      }

      window.addEventListener("scroll", requestUpdate, { passive: true });
      window.addEventListener("resize", function () {
        window.requestAnimationFrame(measure);
      });

      measure();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initCollapsingAvatar);
    } else {
      initCollapsingAvatar();
    }
  })();
</script>
